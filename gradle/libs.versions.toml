# 统一管理依赖版本
[versions]
junit = "5.12.2"
spring-boot = "3.5.16"
mybatis-plus = "3.5.17"
jjwt = "0.12.6"
checkstyle = "11.0.0"

[libraries]
lombok = { module = "org.projectlombok:lombok" }
# spring boot
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-aop = { module = "org.springframework.boot:spring-boot-starter-aop" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-json = { module = "org.springframework.boot:spring-boot-starter-json" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }

# spring security
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }

# mybatis-plus
mybatis-plus-spring-boot3-starter = { module = "com.baomidou:mybatis-plus-spring-boot3-starter", version.ref = "mybatis-plus" }
mybatis-plus-jsqlparser = { module = "com.baomidou:mybatis-plus-jsqlparser", version.ref = "mybatis-plus" }

# mysql 驱动
mysql-connector-j = { module = "com.mysql:mysql-connector-j" }

# flyway
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql" }

# redis
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }

# jjwt, 版本显式声明
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

# testcontainers
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
testcontainers = { module = "org.testcontainers:testcontainers" }
testcontainers-mysql = { module = "org.testcontainers:mysql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }
# redis 官方 testcontainer 模块
testcontainers-redis = { module = "com.redis:testcontainers-redis", version = "2.2.4" }

# test
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# awaitility, 异步等待断言
awaitility = { module = "org.awaitility:awaitility" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
# junit
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

